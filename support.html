<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>客户支持</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core.css">
<link rel="stylesheet" href="form.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="navbar.css">
</head>
<body>

<svg class="svg-filters" aria-hidden="true">
  <defs>
    <filter id="liquid" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.018" numOctaves="3" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
    <filter id="liquidRefraction" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="B" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="2" result="blurred"/>
      <feComposite in="blurred" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
</svg>

<nav class="navbar" id="navbar">
  <a href="https://example.com/" class="nav-item active" data-i18n="nav_home">首页</a>
  <a href="https://example.com/services" class="nav-item" data-i18n="nav_services">服务</a>
  <a href="https://example.com/support" class="nav-item" data-i18n="nav_support">支持</a>
  <div class="nav-item lang-wrapper" id="langWrapper">
    <span class="lang-trigger" data-i18n="nav_lang">语言</span>
    <div class="lang-dropdown">
      <button class="lang-item active" data-lang="cn" data-i18n="lang_cn">Cn</button>
      <button class="lang-item" data-lang="cn_trad" data-i18n="lang_cn_trad">Cn繁</button>
      <button class="lang-item" data-lang="en" data-i18n="lang_en">En</button>
      <button class="lang-item" data-lang="jp" data-i18n="lang_jp">Jp</button>
    </div>
  </div>
</nav>

<div class="container">
  <div class="glass-card">
    <h1 class="title" data-i18n="title">联系我们</h1>
    <p class="subtitle" data-i18n="subtitle">请填写以下信息，我们将尽快为您处理</p>

    <form id="supportForm" novalidate>
      <div class="form-group">
        <label for="name" data-i18n="label_name">对您的称呼</label>
        <div class="input-wrapper">
          <input type="text" id="name" data-i18n-placeholder="placeholder_name" placeholder="请输入您的称呼" autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="email" data-i18n="label_email">联系邮箱</label>
        <div class="input-wrapper">
          <input type="email" id="email" data-i18n-placeholder="placeholder_email" placeholder="请输入您的联系邮箱" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="subject" data-i18n="label_subject">问题选择（主题）</label>
        <div class="custom-select" id="customSelect">
          <div class="custom-select-trigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false">
            <span class="trigger-text" data-i18n="select_placeholder">请选择问题类型</span>
            <div class="arrow"></div>
          </div>
          <div class="custom-select-dropdown" role="listbox">
            <div class="custom-select-option placeholder" data-value="" role="option" data-i18n="select_placeholder">请选择问题类型</div>
            <div class="custom-select-option" data-value="account" role="option" data-i18n="select_account">账户问题</div>
            <div class="custom-select-option" data-value="payment" role="option" data-i18n="select_payment">支付相关</div>
            <div class="custom-select-option" data-value="technical" role="option" data-i18n="select_technical">技术支持</div>
            <div class="custom-select-option" data-value="feedback" role="option" data-i18n="select_feedback">建议反馈</div>
            <div class="custom-select-option" data-value="other" role="option" data-i18n="select_other">其他</div>
          </div>
          <select class="native-select" id="subject">
            <option value="" disabled selected>请选择问题类型</option>
            <option value="account">账户问题</option>
            <option value="payment">支付相关</option>
            <option value="technical">技术支持</option>
            <option value="feedback">建议反馈</option>
            <option value="other">其他</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="message" data-i18n="label_message">详细填写</label>
        <div class="input-wrapper">
          <div class="md-editor" id="mdEditor">
            <div class="md-toolbar">
              <button class="md-toolbar-btn" data-cmd="bold" title="Bold">B</button>
              <button class="md-toolbar-btn" data-cmd="italic" title="Italic"><em>I</em></button>
              <button class="md-toolbar-btn" data-cmd="heading" title="Heading">H</button>
              <div class="md-toolbar-divider"></div>
              <button class="md-toolbar-btn" data-cmd="list" title="List">&#x2022;</button>
              <button class="md-toolbar-btn" data-cmd="link" title="Link">&#x2197;</button>
              <button class="md-toolbar-btn" data-cmd="code" title="Code">&lt;/&gt;</button>
              <div class="md-toolbar-divider"></div>
              <button class="md-toolbar-btn" data-cmd="image" title="Image">Img</button>
            </div>
            <div class="md-tabs">
              <button class="md-tab active" data-tab="edit" data-i18n="tab_edit">编辑</button>
              <button class="md-tab" data-tab="preview" data-i18n="tab_preview">预览</button>
            </div>
            <textarea id="message" class="md-textarea"></textarea>
            <div class="md-preview" id="mdPreview"></div>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" data-i18n="submit">提交</button>
    </form>
  </div>
</div>

<script src="translations.js"></script>
<script src="lang.js"></script>
<script src="app.js"></script>
</body>
</html>
